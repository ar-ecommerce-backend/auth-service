---
spring:
  application:
    name: auth-service
  flyway:
    enabled: false   # dev runs on H2 + ddl-auto; the 'prod' profile enables Flyway
  datasource:
    url: jdbc:h2:mem:authdb;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    show-sql: false
  h2:
    console:
      enabled: true
      path: /h2-console
      settings:
        web-allow-others: true   # dev only - lets the browser reach the in-container console

server:
  port: ${SERVER_PORT:8081}

security:
  jwt:
    # Required, no fallback: injected from the environment (see infra/compose/.env).
    # HS256 needs >= 32 bytes.
    secret: ${JWT_SECRET}
    expiration-ms: ${JWT_EXPIRATION_MS:3600000}
    issuer: ${JWT_ISSUER:ecommerce-auth}

# Demo staff/admin accounts (docs ADR 0007). Each is created only when its password is set;
# passwords are generated per environment (Terraform on AWS, random per run in CI), never committed.
demo-accounts:
  staff:
    email: ${DEMO_STAFF_EMAIL:staff@ar-ecommerce-backend.com}
    password: ${DEMO_STAFF_PASSWORD:}
  admin:
    email: ${DEMO_ADMIN_EMAIL:admin@ar-ecommerce-backend.com}
    password: ${DEMO_ADMIN_PASSWORD:}

management:
  endpoints:
    web:
      exposure:
        include: health,info

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_CLIENT_SERVICEURL_DEFAULTZONE:http://localhost:8761/eureka/}
  instance:
    prefer-ip-address: true

springdoc:
  api-docs:
    # Under the service base path, so the gateway route /api/auth/** serves it too.
    path: /auth/api-docs
